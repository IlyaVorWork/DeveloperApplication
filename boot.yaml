---
gin:
  - name: developer_application
    port: 8080
    enabled: true
    commonService:
      enabled: true
    sw:
      enabled: true
      path: "devapp/sw"
postgres:
  - name: developer_application_postgres
    enabled: true
    addr: "${POSTGRES_ADDR}"
    user: "${POSTGRES_USER}"
    pass: "${POSTGRES_PASS}"
    database:
      - name: "${POSTGRES_DB}"
        autoCreate: true
